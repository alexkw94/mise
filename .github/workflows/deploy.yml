name: Deploy to GitHub Pages

# Die App selbst läuft auf Vercel — sie braucht einen Server für den
# Foto-Upload und die Nährwertschätzung, den GitHub Pages nicht bietet.
#
# Diese alte Adresse bleibt trotzdem bestehen und liefert nur noch eine
# Weiterleitung. Abschalten wäre schlechter: ein vergessenes Symbol auf dem
# Home-Bildschirm und jeder bereits verschickte Teilen-Link (…/?r=…) liefen
# sonst ins Leere. Die Weiterleitung nimmt Query und Hash mit, damit solche
# Links weiterhin funktionieren.
#
# Zurückdrehen: diesen Workflow auf den vorherigen Stand bringen
# (`git log -- .github/workflows/deploy.yml`), dann baut Pages wieder die App.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Weiterleitungsseite vorbereiten
        run: |
          cp -R pages-redirect out
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
